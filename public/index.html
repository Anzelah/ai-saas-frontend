<!DOCTYPE html>
<html lang="en">

    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>PromptCraft AI - AI Cover Letter Generator</title>
    <!-- ✅ SEO Description -->
    <meta name="description" content="Generate tailored, professional cover letters instantly with Lexora AI. Designed to help you stand out and land interviews faster." />

    <!-- ✅ Keywords (optional but fine for portfolio) -->
    <meta name="keywords" content="AI cover letter generator, job application, resume, cover letter tool, AI writing assistant" />

    <!-- ✅ Author -->
    <meta name="author" content="Anzellah" />

    <!-- ✅ Open Graph (for LinkedIn / WhatsApp previews) -->

    <meta property="og:description" content="Create high-quality, personalized cover letters in seconds using AI." />
    <meta property="og:type" content="website" />
